[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-knowledge-agent"
version = "0.1.0"
description = "可审阅的企业知识问答 Agent：原文引用、冲突处理与有界工具循环"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
